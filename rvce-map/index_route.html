/* ===== KEEPING YOUR UI / CSS ===== */
:root{
  --sidebar-w:340px;
  --accent:#1e4db7;
  --bg:#f6efe7;
  --paper-tint:#f9f5f0;
}
html,body{height:100%;margin:0;font-family:system-ui,"Segoe UI",Roboto,Arial;background:var(--bg);}
#map{position:absolute;inset:0;background:var(--paper-tint);}

/* Sidebar */

class TopViewControl {
  onAdd(map) {
    this.map = map;

    // IMPORTANT: control container
    this.container = document.createElement("div");
    this.container.className = "maplibregl-ctrl maplibregl-ctrl-group";

    this.btn = document.createElement("button");
    this.btn.type = "button";
    this.btn.title = "Top / 3D View";
    this.btn.innerHTML = "⬆️";

    this.btn.onclick = () => {
      window.__TOP_VIEW__ = !window.__TOP_VIEW__;

      if (window.__TOP_VIEW__) {
        map.easeTo({ pitch: 0, bearing: 0, duration: 500 });
        this.btn.innerHTML = "🏙️";
      } else {
        map.easeTo({
          pitch: 60,
          bearing: VIEWS[viewIndex].bearing,
          duration: 500
        });
        this.btn.innerHTML = "⬆️";
      }
    };

    this.container.appendChild(this.btn);
    return this.container;
  }

  onRemove() {
    this.container.remove();
    this.map = undefined;
  }
}
class RotateViewControl {
  onAdd(map) {
    this.map = map;

    // SAME control group → vertical stack
    this.container = document.createElement("div");
    this.container.className = "maplibregl-ctrl maplibregl-ctrl-group";

    this.btn = document.createElement("button");
    this.btn.type = "button";
    this.btn.title = "Rotate View (N / E / S / W)";
    this.btn.innerHTML = "🧭";

    this.btn.onclick = () => {
      if (window.__TOP_VIEW__) return;

      viewIndex = (viewIndex + 1) % VIEWS.length;
      map.easeTo({
        bearing: VIEWS[viewIndex].bearing,
        pitch: 60,
        duration: 500
      });
    };

    this.container.appendChild(this.btn);
    return this.container;
  }

  onRemove() {
    this.container.remove();
    this.map = undefined;
  }
}

    bearing: VIEWS[viewIndex].bearing,

    duration: 600

  input.addEventListener('input',()=>{

  `<div class="suggest-item" data-id="${x.id}">${x.name}</div>`

/* ================= GRAPH + ROUTING ================= */
let graphNodes={}, graphEdges={};
let graphReady = false;
let startMarker = null;
let endMarker = null;

function dijkstra(nodes,edges,s,t){
  const dist={},prev={},Q=new Set(Object.keys(nodes));
  Object.keys(nodes).forEach(k=>dist[k]=Infinity);
  dist[s]=0;
  while(Q.size){
    let u=[...Q].reduce((a,b)=>dist[a]<dist[b]?a:b);
    Q.delete(u);
    if(u===t) break;
    (edges[u]||[]).forEach(e=>{
      const alt=dist[u]+e.w;
      if(alt<dist[e.to]){dist[e.to]=alt;prev[e.to]=u;}
    });
  }
  const path=[]; let c=t;
  while(c){path.unshift(c);c=prev[c];}
  return path;
}
function buildGraphFromPaths(geojson) {
  const nodes = {};
  const edges = {};

  function nodeId(coord) {
    return coord[0].toFixed(6) + ',' + coord[1].toFixed(6);
  }

  function addLine(coords) {
    for (let i = 0; i < coords.length - 1; i++) {
      const a = coords[i];
      const b = coords[i + 1];

      const u = nodeId(a);
      const v = nodeId(b);

      nodes[u] = { id: u, x: a[0], y: a[1] };
      nodes[v] = { id: v, x: b[0], y: b[1] };

      const R = 6371000;
      const toRad = d => d * Math.PI / 180;

      const dLat = toRad(b[1] - a[1]);
      const dLon = toRad(b[0] - a[0]);
      const lat1 = toRad(a[1]);
      const lat2 = toRad(b[1]);

      const d =
        2 * R * Math.asin(Math.sqrt(
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) *
          Math.sin(dLon / 2) ** 2
        ));

      edges[u] = edges[u] || [];
      edges[v] = edges[v] || [];
      edges[u].push({ to: v, w: d });
      edges[v].push({ to: u, w: d });
    }
  }

  geojson.features.forEach(f => {
    if (!f.geometry) return;

    if (f.geometry.type === 'LineString') {
      addLine(f.geometry.coordinates);
    }

    if (f.geometry.type === 'MultiLineString') {
      f.geometry.coordinates.forEach(addLine);
    }
  });

  return { nodes, edges };
}
const MAX_SNAP_DISTANCE_METERS = 300; // adjust 50–120 if needed
function nearestNode(lat, lon) {
  let best = null;
  let bestDist = Infinity;

  const R = 6371000;
  const toRad = d => d * Math.PI / 180;

  for (const id in graphNodes) {
    const n = graphNodes[id];

    const dLat = toRad(n.y - lat);
    const dLon = toRad(n.x - lon);

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat)) *
      Math.cos(toRad(n.y)) *
      Math.sin(dLon / 2) ** 2;

    const d = 2 * R * Math.asin(Math.sqrt(a));

    if (d < bestDist) {
      bestDist = d;
      best = id;
    }
  }

  // IMPORTANT PART
  if (bestDist > MAX_SNAP_DISTANCE_METERS) {
  console.warn(
    "Snapping far from path:",
    Math.round(bestDist), "meters"
  );
}

  return best;
}
function addOrMoveMarker(existingMarker, lngLat, color) {
  if (existingMarker) {
    existingMarker.setLngLat(lngLat);
    return existingMarker;
  }
  return new maplibregl.Marker({ color })
    .setLngLat(lngLat)
    .addTo(map);
}

    id: `b_json_${idx}`,
    name: name,
    coords: coords,
    type: 'building'
  });

  id: 'b3d',
  type: 'fill-extrusion',
  source: 'buildings',
  paint: {

    // Works for Polygon + MultiPolygon
    // Priority:
    // 1. height (meters)
    // 2. building:levels × 3
    // 3. default = 10m
    'fill-extrusion-height': [
      'case',

      // if "height" exists
      ['has', 'height'],
      ['to-number', ['get', 'height']],

      // else if "building:levels" exists
      ['has', 'building:levels'],
      ['*', ['to-number', ['get', 'building:levels']], 3],

      // else default height
      10
    ],

    'fill-extrusion-base': 0,
    'fill-extrusion-opacity': 0.95
  }
});

/* ================= ROUTE UI ================= */
computeRoute.onclick = () => {

  if (!graphReady) {
    alert("Path network is still loading. Please wait a moment.");
    return;
  }

  function getSelectedItem(input){
    if (!input.dataset.selectedId) return null;
    return searchItems.find(s => s.id === input.dataset.selectedId);
  }

  const startItem = getSelectedItem(startInput);
  const endItem   = getSelectedItem(endInput);
  updateLocationInfo(startItem, endItem);

  if (!startItem || !endItem) {
    alert("Please select start and end ONLY from autosuggestions");
    return;
  }

  const startNode = nearestNode(
    startItem.coords[1],
    startItem.coords[0]
  );
  const endNode = nearestNode(
    endItem.coords[1],
    endItem.coords[0]
  );
  // 🟢 Start marker (green)
startMarker = addOrMoveMarker(
  startMarker,
  [startItem.coords[0], startItem.coords[1]],
  "#2ecc71"
);

// 🔴 End marker (red)
endMarker = addOrMoveMarker(
  endMarker,
  [endItem.coords[0], endItem.coords[1]],
  "#e74c3c"
);

  if (!startNode || !endNode) {
    alert("Could not snap to walking paths");
    return;
  }

  const path = dijkstra(
    graphNodes,
    graphEdges,
    startNode,
    endNode
  );

  if (!path || path.length < 2) {
    alert("No route found");
    return;
  }

  const routeGeo = {
    type: "FeatureCollection",
    features: [{
      type: "Feature",
      geometry: {
        type: "LineString",
        coordinates: path.map(id => [
          graphNodes[id].x,
          graphNodes[id].y
        ])
      }
    }]
  };

  map.getSource("route").setData(routeGeo);
};
resetRouteBtn.onclick = () => {
  map.getSource('route').setData({
    type: 'FeatureCollection',
    features: []
  });

  if (startMarker) {
    startMarker.remove();
    startMarker = null;
  }
  if (endMarker) {
    endMarker.remove();
    endMarker = null;
  }
};
</script>

</body>
